name: diag llama bridges (temporary)

on:
  push:
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/diag-llama.yml, fetch/chains.py]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the new netflow / bridges parser against live DefiLlama
        run: |
          python - <<'PY'
          import json
          from fetch.common import Http, Status
          from fetch.chains import netflow_and_bridges
          st = Status()
          nf, gross, br = netflow_and_bridges(Http(timeout=30.0), st)
          print("STATUS", json.dumps({k: v for k, v in st.sources.items()}))
          print("RESULT_JSON", json.dumps({"NETFLOW": nf, "GROSS": gross, "BRIDGES": br}, separators=(",", ":")))
          PY
