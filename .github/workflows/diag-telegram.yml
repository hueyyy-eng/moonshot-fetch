name: diag telegram test (temporary)
on:
  push:
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/diag-telegram.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests
      - name: Send one test message to the owner's Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan/telegram.py --test
