name: Quick Solana check (Telegram alerts)

# Owner, 9 Nov 2026: a light Solana-only search every 2 hours between the daily scans, with a Telegram alert for
# tokens that would be on Igniting, Runners or Momentum AND score 60+. Quiet 11pm-7am SGT.
# The cron lines are 7:23am, 9:23am ... 9:23pm SGT; GitHub often starts scheduled runs late, and a run that lands
# inside the quiet hours sends nothing (fetch/quick.py checks the clock). Changes nothing on the dashboard.
on:
  schedule:
    - cron: "23 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even inside the quiet hours (for a test)"
        type: boolean
        default: false
  push:                                   # temporary: one test run from the working branch, removed before merge
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/quick.yml]

permissions:
  contents: read

concurrency:
  group: quick-solana-check
  cancel-in-progress: true                # a late run is replaced by the newer one, never stacked

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Remember which tokens were already alerted
        uses: actions/cache/restore@v5
        with:
          path: .alerts
          key: quick-alerts-${{ github.run_id }}
          restore-keys: quick-alerts-
      - name: Search Solana and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fetch.quick "$GITHUB_WORKSPACE" ${{ inputs.force && '--force' || '' }}
      - name: Save the list of alerted tokens
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .alerts
          key: quick-alerts-${{ github.run_id }}
