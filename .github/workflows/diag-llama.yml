name: diag llama bridges (temporary)

on:
  push:
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/diag-llama.yml]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect DefiLlama bridges pages and API
        shell: python
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40)
                  return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e)[:200]
          def show(v, depth=0, maxd=2):
              if isinstance(v, dict):
                  return {k: (show(x, depth + 1, maxd) if depth < maxd else type(x).__name__) for k, x in list(v.items())[:40]}
              if isinstance(v, list):
                  return [f"list[{len(v)}]", show(v[0], depth + 1, maxd) if v else None]
              return v if not isinstance(v, str) else v[:80]
          for path in ("/bridges", "/bridges/chains"):
              code, html = get("https://defillama.com" + path)
              print(f"\n===== {path}: HTTP {code}, {len(html)} chars")
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              print("has __NEXT_DATA__:", bool(m), "| app-router chunks (self.__next_f):", html.count("self.__next_f"))
              for w in ("netflowsData", "netflows", "filteredBridges", "tableData", "prevDayUsdDeposits", "lastDailyVolume"):
                  print(f"  mentions {w!r}: {html.count(w)}")
              if m:
                  pp = json.loads(m.group(1)).get("props", {}).get("pageProps", {})
                  print("pageProps keys:", list(pp.keys()))
                  print(json.dumps(show(pp), default=str)[:6000])
              else:
                  for w in ("netflow", "filteredBridges", "tableData"):
                      i = html.find(w)
                      if i >= 0:
                          print(f"  context {w!r}:", html[max(0, i - 200):i + 400].replace("\n", " "))
          for u in ("https://bridges.llama.fi/bridges?includeChains=true",
                    "https://bridges.llama.fi/bridgevolume/all",
                    "https://bridges.llama.fi/netflows/day",
                    "https://api.llama.fi/bridges?includeChains=true"):
              code, body = get(u)
              print(f"\n===== {u}: HTTP {code}, {len(body)} chars")
              try:
                  j = json.loads(body)
                  print(json.dumps(show(j, maxd=3), default=str)[:3000])
              except Exception:
                  print(body[:300])
