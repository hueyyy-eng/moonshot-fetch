name: diag narrative sources (temporary)
on:
  push:
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/diag-nar.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the new classifier on every token on the page that is Unclassified or recently seen
        run: |
          python - <<'PY'
          import json, re
          s = open("site/page.html", encoding="utf-8").read()
          T = json.loads(re.search(r"const TOKENS\s*=\s*(\[.*?\]);\n", s, re.S).group(1))
          todo = [t for t in T if (t.get("nar") or "Unclassified") == "Unclassified"]
          json.dump(todo, open("/tmp/todo.json", "w"))
          print(len(todo), "unclassified tokens on the page")
          PY
          python scan/auto_nar.py /tmp/todo.json /tmp/nar.json
          python -c "import json;d=json.load(open('/tmp/nar.json'));print(json.dumps(d.get('_stats')));[print(k[:12],v) for k,v in d.items() if k!='_stats']"
