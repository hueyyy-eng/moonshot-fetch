name: Quick Solana + BSC check (Telegram alerts)

# Owner, 9 Nov 2026: a light Solana search every 2 hours between the daily scans, with a Telegram alert for
# tokens that would be on Igniting, Runners or Momentum AND score 60+. Quiet 11pm-7am SGT. BSC added 11 Nov 2026,
# plus the silent Micro / Early watch log (Solana $50k-$500k tokens written down and re-priced, no alerts).
# The cron lines are 7:23am, 9:23am ... 9:23pm SGT; GitHub often starts scheduled runs late, and a run that lands
# inside the quiet hours sends nothing (fetch/quick.py checks the clock). Changes nothing on the dashboard.
# Self-restarting chain (owner, 13 Nov 2026): GitHub drops many timed starts (12 Nov: 2 of 8 ran), so after each
# check the "next" job waits until the next slot and presses this workflow's own "Run workflow" button
# (scan/quick_next.py works out the time; overnight one "relay" run only waits and passes it on). The cron line
# stays as a backup: if the chain ever breaks, the next timed start restarts it, and the newest chain always
# replaces an older one (concurrency below), so there is never more than one.
on:
  schedule:
    - cron: "23 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even inside the quiet hours (for a test)"
        type: boolean
        default: false
      relay:
        description: "Internal (overnight): no check, only wait for the morning slot and start it"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quick:
    if: ${{ !inputs.relay }}
    concurrency:
      group: quick-solana-check
      cancel-in-progress: true            # a late run is replaced by the newer one, never stacked
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Remember which tokens were already alerted (and the watch log)
        uses: actions/cache/restore@v5
        with:
          path: .alerts
          key: quick-alerts-${{ github.run_id }}
          restore-keys: quick-alerts-
      - name: Search Solana and BSC, send alerts, update the watch log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fetch.quick "$GITHUB_WORKSPACE" ${{ inputs.force && '--force' || '' }}
      - name: Save the list of alerted tokens
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .alerts
          key: quick-alerts-${{ github.run_id }}

  # waits until the next slot, then starts the next quick check (GitHub's own "Run workflow"; starts within a minute)
  next:
    needs: quick
    if: ${{ !cancelled() }}               # also after a failed check, so one bad run never stops the chain
    concurrency:
      group: quick-chain
      cancel-in-progress: true            # a newer chain replaces an older one: never two waiting at once
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write                      # only to press this workflow's own "Run workflow" button
    steps:
      - uses: actions/checkout@v5
      - name: Work out the next slot
        id: plan
        run: python3 scan/quick_next.py >> "$GITHUB_OUTPUT"
      - name: Wait until then
        run: |
          echo "next: ${{ steps.plan.outputs.slot }} SGT (relay=${{ steps.plan.outputs.relay }}), waiting ${{ steps.plan.outputs.wait }} s"
          sleep "${{ steps.plan.outputs.wait }}"
      - name: Start the next quick check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quick.yml --repo "$GITHUB_REPOSITORY" --ref main -f relay=${{ steps.plan.outputs.relay }}
