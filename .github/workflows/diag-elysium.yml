name: diag elysium (temporary)
on:
  push:
    branches: [claude/funny-goodall-y0z745]
    paths: [.github/workflows/diag-elysium.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chain id of Elysium (chainlist)
        run: |
          curl -s https://chainid.network/chains.json | python3 -c "import json,sys;[print(c['chainId'],c['name'],c.get('nativeCurrency',{}).get('symbol'),c.get('rpc',[])[:2]) for c in json.load(sys.stdin) if 'elysium' in c['name'].lower()]"
      - name: GoPlus supported chains
        run: |
          curl -s "https://api.gopluslabs.io/api/v1/supported_chains?name=token_security" | python3 -c "import json,sys;d=json.load(sys.stdin).get('result',[]);print(len(d),'chains');print([c for c in d if 'ely' in (c.get('name','')+str(c.get('id'))).lower()] or 'elysium not listed')"
      - name: One Elysium token through GoPlus / Honeypot.is (by guessed chain id)
        run: |
          pool=$(curl -s "https://api.geckoterminal.com/api/v2/networks/elysium/pools?page=1&sort=h24_volume_usd_desc" | python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print(d[4]['relationships']['base_token']['data']['id'].split('_',1)[1])")
          echo "token $pool"
          for id in $(curl -s https://chainid.network/chains.json | python3 -c "import json,sys;print(' '.join(str(c['chainId']) for c in json.load(sys.stdin) if 'elysium' in c['name'].lower()))"); do
            echo "== chain $id GoPlus"; curl -s "https://api.gopluslabs.io/api/v1/token_security/$id?contract_addresses=$pool" | head -c 300; echo
            echo "== chain $id honeypot.is"; curl -s "https://api.honeypot.is/v2/IsHoneypot?address=$pool&chainID=$id" | head -c 300; echo
          done
      - name: GeckoTerminal token info (holders) for that token
        run: |
          pool=$(curl -s "https://api.geckoterminal.com/api/v2/networks/elysium/pools?page=1&sort=h24_volume_usd_desc" | python3 -c "import json,sys;d=json.load(sys.stdin)['data'];print(d[4]['attributes']['address'])")
          sleep 3; curl -s "https://api.geckoterminal.com/api/v2/networks/elysium/pools/$pool/ohlcv/day?limit=5" | head -c 300; echo
