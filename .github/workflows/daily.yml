name: Moonshot daily fetch

on:
  schedule:
    # Owner, 1-2 Nov 2026: GitHub has been starting scheduled runs 5-6 h late and a scan takes 1.5-2 h,
    # so the scans are scheduled well before the time the page should be ready:
    #   18:53 UTC = 2:53am SGT  -> morning page, usually ready ~10-10:30am SGT
    #   04:37 UTC = 12:37pm SGT -> evening page, usually ready ~8pm SGT
    # The morning scan never fetches before 00:15 UTC (8:15am SGT), when CoinGecko/GeckoTerminal and
    # DefiLlama have closed the previous day (see the wait job). 18:53 keeps that wait under GitHub's
    # 6-hour job limit even when GitHub starts on time. SCAN_SLOT below follows these two lines.
    - cron: "53 18 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Rebuild the page from the snapshot already in latest/ (no new fetch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moonshot-fetch-v2
  cancel-in-progress: false

env:
  # morning or evening scan, by which schedule started the run (manual runs: decided by the clock in fetch/main.py)
  SCAN_SLOT: ${{ github.event.schedule == '53 18 * * *' && 'am' || github.event.schedule == '37 4 * * *' && 'pm' || '' }}

jobs:
  wait:
    # Morning scan only: wait until 00:15 UTC (8:15am SGT) so the daily candles and chain volumes include
    # yesterday's closed day. A separate job so the wait does not eat into the fetch job's time limit.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for the daily close (8:15am SGT) if the morning scan started early
        run: |
          if [ "$SCAN_SLOT" != "am" ]; then echo "not the morning scan - no wait"; exit 0; fi
          now=$(date -u +%s)
          target=$(date -u -d "today 00:15" +%s)
          if [ "$(date -u +%H)" -ge 12 ]; then target=$(date -u -d "tomorrow 00:15" +%s); fi
          wait=$(( target - now ))
          if [ "$wait" -le 0 ]; then echo "after 8:15am SGT already - no wait"; exit 0; fi
          if [ "$wait" -gt 20400 ]; then wait=20400; fi   # stay under this job's time limit
          echo "started $(TZ=Asia/Singapore date '+%H:%M') SGT - waiting $(( wait / 60 )) min for the daily close"
          sleep "$wait"

  fetch:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch every source and write today's snapshot
        if: ${{ !inputs.skip_fetch }}
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: python -m fetch.main "$GITHUB_WORKSPACE"

      - name: Show source status
        run: python -c "import json;d=json.load(open('latest/status.json'));print(d['generated_at_sgt']);[print(f\"{k:28s} {v.get('state'):8s} {v.get('note') or v.get('error') or ''}\") for k,v in d['sources'].items()]"

      - name: Commit snapshot
        if: ${{ !inputs.skip_fetch }}
        run: |
          git config user.name "moonshot-fetch[bot]"
          git config user.email "moonshot-fetch@users.noreply.github.com"
          git add snapshots latest
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # rebase-and-retry: main can move while a 45-100 min fetch runs. snapshots/ and latest/
          # never conflict with code, so a rebase applies cleanly.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || { echo "rebase failed"; exit 1; }
          done
          echo "push failed after 5 attempts"; exit 1

      # ---------- build the dashboard page here, so the cloud task only has to publish a file ----------
      # site/page.html is the last page this job built; the builder reads it for carry-forward and the
      # four logs, and the result replaces it. The page is stamped with the SNAPSHOT's time, never the
      # clock, so a rebuild of an old snapshot can never claim newer data than it has.

      - name: Install the page checker (Playwright + Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build the page from the snapshot
        run: |
          NOW=$(python -c "import json;print(json.load(open('latest/status.json'))['generated_at_sgt'])")
          echo "building for $NOW"
          set +e
          python scan/build_block.py --page site/page.html --scan latest/scan.json --status latest/status.json --out out/ --now "$NOW"
          rc=$?
          if [ $rc -eq 3 ]; then
            python scan/auto_nar.py out/nar_todo.json out/nar.json
            python scan/build_block.py --page site/page.html --scan latest/scan.json --status latest/status.json --out out/ --now "$NOW" --nar out/nar.json --allow-unclassified
            rc=$?
          fi
          exit $rc

      - name: Check the rendered page (fails the run, and publishes nothing, if anything is wrong)
        run: python scan/verify_page.py out/page_new.html out/summary.json

      # the quick check's silent Micro / Early watch log lives in its cache; a copy is kept in site/ for the Review tab
      - name: Get the quick check's watch log
        uses: actions/cache/restore@v5
        with:
          path: .alerts
          key: quick-alerts-daily-${{ github.run_id }}
          restore-keys: quick-alerts-

      - name: Commit the built page
        run: |
          if [ -f .alerts/watch.json ]; then cp .alerts/watch.json site/micro-watch.json; fi
          cp out/page_new.html site/page.html
          cp out/summary.json site/summary.json
          cp out/track-record.csv site/track-record.csv
          if [ -f out/nar.json ]; then cp out/nar.json site/nar_auto.json; else echo "{}" > site/nar_auto.json; fi
          python scan/pattern_study.py . site/page.html || echo "pattern study failed - page still published"
          # Review tab: the owner's back-tests, recalculated from all scans (also site/review.json for the fortnightly review)
          python scan/review_study.py . site/page.html || echo "review study failed - page still published"
          # the three running logs as CSV for Google Drive. Old copies are removed first, so a failed export
          # leaves them missing (the Drive step below then fails, instead of re-uploading yesterday's files).
          rm -f site/near-miss-log.csv site/narrative-log.csv site/holder-log.csv
          python scan/export_logs.py site/page.html site/ || echo "log export failed - page still published"
          git config user.name "moonshot-fetch[bot]"
          git config user.email "moonshot-fetch@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "page unchanged"; exit 0; fi
          git commit -m "page $(python -c "import json;print(json.load(open('site/summary.json'))['now'])")"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || { echo "rebase failed"; exit 1; }
          done
          echo "push failed after 5 attempts"; exit 1

      # Runs after every scan (both daily times and manual runs), once the page is already published.
      # Any file not copied turns the run red, so the owner gets GitHub's failure email.
      - name: Copy the CSV files to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install google-auth
          python scan/upload_drive.py site/
